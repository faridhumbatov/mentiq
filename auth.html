<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Məntiq.ON - Daxil ol / Qeydiyyat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#6F61EF',
                        brandDark: '#5849E0',
                        brandLight: '#EEECFC',
                        accentYellow: '#FCD53F',
                        ink: '#1E2235',
                        muted: '#7E849B',
                        surface: '#F8F9FC'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FFFFFF;
            color: #1E2235;
            -webkit-tap-highlight-color: transparent;
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            user-select: none;
        }
    </style>
</head>

<body
    class="min-h-screen flex flex-col items-center justify-center max-w-md mx-auto relative bg-surface border-x border-slate-100 p-5">

    <!-- ==================== ÜST KART (FORM BÖLGƏSİ) ==================== -->
    <div class="w-full bg-white rounded-[32px] p-6 border border-slate-200/80 shadow-xl shadow-slate-200/50 space-y-5">

        <!-- Loqo və Başlıq -->
        <div class="flex items-center space-x-3">
            <div
                class="w-12 h-12 rounded-2xl bg-gradient-to-br from-brand to-brandDark flex items-center justify-center text-white shadow-md shadow-brand/20">
                <span class="material-symbols-rounded text-[26px]">psychology</span>
            </div>
            <div>
                <h1 class="text-lg font-black text-ink tracking-tight">Məntiq.ON</h1>
                <p class="text-[11px] font-semibold text-muted">Biliklərini onlayn sınaqdan keçir</p>
            </div>
        </div>

        <!-- TAB SEÇİCİ (Giriş / Qeydiyyat) -->
        <div id="authTabs" class="grid grid-cols-2 p-1 rounded-2xl bg-surface border border-slate-200/80">
            <button onclick="switchTab('login')" id="loginTabBtn"
                class="py-2.5 rounded-xl text-xs font-extrabold transition bg-white text-brand shadow-xs">
                Giriş
            </button>
            <button onclick="switchTab('signup')" id="signupTabBtn"
                class="py-2.5 rounded-xl text-xs font-extrabold transition text-muted hover:text-ink">
                Qeydiyyat
            </button>
        </div>


        <!-- 1. GİRİŞ FORMASI -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div class="space-y-1.5">
                <label class="text-[11px] font-bold text-muted uppercase tracking-wider block">Telefon nömrəsi və ya
                    e-poçt</label>
                <input type="text" required placeholder="+994 50 123 45 67 və ya ad@gmail.com"
                    class="w-full px-4 py-3 rounded-2xl bg-surface border border-slate-200 text-xs font-bold text-ink focus:border-brand focus:bg-white outline-none transition">
            </div>

            <div class="space-y-1.5">
                <label class="text-[11px] font-bold text-muted uppercase tracking-wider block">Şifrə</label>
                <input type="password" required placeholder="••••••••"
                    class="w-full px-4 py-3 rounded-2xl bg-surface border border-slate-200 text-xs font-bold text-ink focus:border-brand focus:bg-white outline-none transition">
            </div>

            <button type="submit"
                class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-brand to-brandDark text-white font-extrabold text-xs shadow-md shadow-brand/20 active:scale-[0.99] transition">
                Daxil ol
            </button>

            <div class="text-center pt-1">
                <button type="button" onclick="switchTab('forgot')"
                    class="text-xs font-extrabold text-brand hover:underline">
                    Şifrəni unutmusunuz?
                </button>
            </div>
        </form>


        <!-- 2. QEYDİYYAT FORMASI -->
        <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-3.5 hidden">
            <div class="space-y-1">
                <label class="text-[10px] font-bold text-muted uppercase tracking-wider block">Ad Soyad</label>
                <input type="text" required placeholder="Məs: Fərid Hümbətov"
                    class="w-full px-3.5 py-2.5 rounded-2xl bg-surface border border-slate-200 text-xs font-bold text-ink focus:border-brand focus:bg-white outline-none transition">
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold text-muted uppercase tracking-wider block">E-poçt</label>
                <input type="email" required placeholder="ad@gmail.com"
                    class="w-full px-3.5 py-2.5 rounded-2xl bg-surface border border-slate-200 text-xs font-bold text-ink focus:border-brand focus:bg-white outline-none transition">
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold text-muted uppercase tracking-wider block">Telefon nömrəsi</label>
                <input type="tel" required placeholder="+994 50 123 45 67"
                    class="w-full px-3.5 py-2.5 rounded-2xl bg-surface border border-slate-200 text-xs font-bold text-ink focus:border-brand focus:bg-white outline-none transition">
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold text-muted uppercase tracking-wider block">Şifrə</label>
                <input type="password" required placeholder="Ən az 8 simvol, hərf və rəqəm"
                    class="w-full px-3.5 py-2.5 rounded-2xl bg-surface border border-slate-200 text-xs font-bold text-ink focus:border-brand focus:bg-white outline-none transition">
            </div>

            <button type="submit"
                class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-brand to-brandDark text-white font-extrabold text-xs shadow-md shadow-brand/20 active:scale-[0.99] transition mt-2">
                Qeydiyyatdan keç
            </button>
        </form>


        <!-- 3. ŞİFRƏNİ BƏRPA ETMƏ (FORGOT PASSWORD) FORMASI -->
        <form id="forgotForm" onsubmit="handleForgot(event)" class="space-y-4 hidden">
            <div class="space-y-1.5">
                <label class="text-[11px] font-bold text-muted uppercase tracking-wider block">Telefon nömrəsi və ya
                    e-poçt</label>
                <input type="text" required placeholder="+994 50 123 45 67 və ya ad@gmail.com"
                    class="w-full px-4 py-3 rounded-2xl bg-surface border border-slate-200 text-xs font-bold text-ink focus:border-brand focus:bg-white outline-none transition">
            </div>

            <button type="submit"
                class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-brand to-brandDark text-white font-extrabold text-xs shadow-md shadow-brand/20 active:scale-[0.99] transition">
                Kod göndər
            </button>

            <div class="text-center pt-1">
                <button type="button" onclick="switchTab('login')"
                    class="text-xs font-extrabold text-muted hover:text-ink transition inline-flex items-center space-x-1">
                    <span class="material-symbols-rounded text-[16px]">arrow_back</span>
                    <span>Girişə qayıt</span>
                </button>
            </div>
        </form>

    </div>


    <!-- ==================== JAVASCRIPT MƏNTİQİ ==================== -->
    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const forgotForm = document.getElementById('forgotForm');
            const authTabs = document.getElementById('authTabs');

            const loginBtn = document.getElementById('loginTabBtn');
            const signupBtn = document.getElementById('signupTabBtn');

            // Hamısını gizlət
            loginForm.classList.add('hidden');
            signupForm.classList.add('hidden');
            forgotForm.classList.add('hidden');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                authTabs.classList.remove('hidden');
                loginBtn.className = "py-2.5 rounded-xl text-xs font-extrabold transition bg-white text-brand shadow-xs";
                signupBtn.className = "py-2.5 rounded-xl text-xs font-extrabold transition text-muted hover:text-ink";
            } else if (tab === 'signup') {
                signupForm.classList.remove('hidden');
                authTabs.classList.remove('hidden');
                signupBtn.className = "py-2.5 rounded-xl text-xs font-extrabold transition bg-white text-brand shadow-xs";
                loginBtn.className = "py-2.5 rounded-xl text-xs font-extrabold transition text-muted hover:text-ink";
            } else if (tab === 'forgot') {
                forgotForm.classList.remove('hidden');
                authTabs.classList.add('hidden');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            window.location.href = 'panel.html';
        }

        function handleSignup(e) {
            e.preventDefault();
            alert('Qeydiyyat uğurla tamamlandı! İndi daxil ola bilərsiniz.');
            switchTab('login');
        }

        function handleForgot(e) {
            e.preventDefault();
            alert('Şifrəni bərpa etmək üçün təsdiq kodu göndərildi!');
            switchTab('login');
        }
    </script>

</body>

</html>
